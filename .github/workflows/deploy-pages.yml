name: Deploy Nightforge to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_linux_baselines:
        description: Generate pinned Linux screenshot candidates as a review artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture pinned Linux screenshot candidates
        if: github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines
        run: npm run test:phase11:browser -- --update-snapshots
      - run: npm run verify
      - name: Upload pinned Linux screenshot candidates
        if: github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightforge-linux-screenshot-candidates
          path: tests/__screenshots__/linux
          if-no-files-found: error
      - name: Build repository-specific Pages artifact
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" == "aomarco/Roll30" ]]; then
            npm run build
          else
            npm run build:preview
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines)
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
