name: Deploy Nightforge to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_linux_baselines:
        description: Generate pinned Linux screenshot candidates as a review artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture pinned Linux screenshot candidates
        if: github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines
        run: npm run test:phase11:browser -- --update-snapshots
      - run: npm run verify
      - name: Upload pinned Linux screenshot candidates
        if: github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines
        uses: actions/upload-artifact@v4
        with:
          name: nightforge-linux-screenshot-candidates
          path: tests/__screenshots__/linux
          if-no-files-found: error
      - name: Build repository-specific Pages artifact
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" == "aomarco/Roll30" ]]; then
            npm run build
          else
            npm run build:preview
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines)
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.capture_linux_baselines)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
